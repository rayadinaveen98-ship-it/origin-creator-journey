plugins {
    id 'com.android.application'
}

android {
    namespace 'com.origin.creatorjourney'
    compileSdk 35

    defaultConfig {
        applicationId 'com.origin.creatorjourney'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.0.0-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
