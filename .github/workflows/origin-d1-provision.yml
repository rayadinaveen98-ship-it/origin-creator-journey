name: Provision isolated ORIGIN D1 database (no app deployment)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/origin-d1-provision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: origin-d1-provision-once
  cancel-in-progress: false
jobs:
  provision:
    name: Create ORIGIN-only database and run tracked migration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify D1 identity and access security before provisioning
        run: node --experimental-sqlite tests/v11-d1-integration.mjs
      - name: Validate existing Cloudflare credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare credentials unavailable. ORIGIN D1 NOT created."
            exit 1
          fi
      - name: Provision ONLY origin-editorial-v1 if absent
        id: d1_provision
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync,appendFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
          let account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'').trim();
          if(!/^[0-9a-f]{32}$/i.test(account)){
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=100',{headers});
            const data=await response.json().catch(()=>null);
            const entries=data?.success&&Array.isArray(data.result)?data.result:[];
            if(!response.ok||!entries.length)
              throw Error('Stored Cloudflare Account ID is malformed, and token cannot enumerate accounts. Set CLOUDFLARE_ACCOUNT_ID to the real 32-character Account ID in GitHub Actions Secrets; ORIGIN D1 unchanged.');
            let matches=[];
            for(const item of entries.slice(0,30)){
              if(!/^[0-9a-f]{32}$/i.test(item.id||''))continue;
              const worker=await fetch('https://api.cloudflare.com/client/v4/accounts/'+item.id+'/workers/scripts/origin-creator-journey',{headers});
              if(worker.ok)matches.push(item);
            }
            if(matches.length===1)account=matches[0].id;
            else if(entries.length===1&&/^[0-9a-f]{32}$/i.test(entries[0].id))account=entries[0].id;
            else throw Error('Multiple or inaccessible Cloudflare accounts; cannot prove which owns ORIGIN. Set the correct Cloudflare Account ID in GitHub Actions Secrets.');
            console.log('Resolved Cloudflare account via existing token without revealing it or changing resources.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'resolved_account_id='+account+'\n');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database';
          async function call(method,path='',body){
            const response=await fetch(endpoint+path,{method,headers,body:body?JSON.stringify(body):undefined});
            const data=await response.json().catch(()=>null);
            if(!response.ok||!data?.success){
              const codes=(Array.isArray(data?.errors)?data.errors:[]).slice(0,4).map(e=>String(e.code||'unknown')).join(',')||'not_provided';
              if(method==='GET'){
                const looksLikeAccount=/^[0-9a-f]{32}$/i.test(account);
                console.log('Cloudflare account identifier shape valid: '+looksLikeAccount);
                const workerCheck=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/origin-creator-journey',{headers});
                console.log('Read existing public ORIGIN Worker: HTTP '+workerCheck.status+' (used only to distinguish account identity from D1 token scope).');
              }
              throw new Error('D1 API '+method+' denied (HTTP '+response.status+', Cloudflare code(s): '+codes+'). Existing token may require account-level D1 Read / D1 Write. No other projects modified.');
            }
            return data.result;
          }
          let found=null, page=1;
          do {
            const result=await call('GET','?per_page=100&page='+page);
            const items=Array.isArray(result)?result:result?.results||[];
            found=items.find(v=>v.name==='origin-editorial-v1')||found;
            if(found||items.length<100)break;
            page++;
          }while(page<=15);
          if(!found){
            found=await call('POST','',{name:'origin-editorial-v1',primary_location_hint:'apac'});
            console.log('Dedicated ORIGIN D1 database created with APAC location hint.');
          }else console.log('Dedicated ORIGIN D1 database already exists; safe to apply pending migrations.');
          const id=found.uuid||found.id;
          if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('Cloudflare did not return a valid D1 database ID.');
          const config={
            name:'origin-d1-migration-tool',compatibility_date:'2026-10-28',
            d1_databases:[{binding:'ORIGIN_EDITORIAL_DB',database_name:'origin-editorial-v1',
              database_id:id,migrations_dir:'backend/d1/migrations'}]
          };
          writeFileSync('origin.d1.provision.jsonc',JSON.stringify(config,null,2));
          console.log('Isolated migration binding prepared. No Worker or public route deployed.');
          NODE
      - name: Apply tracked initial migration to ORIGIN only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.d1_provision.outputs.resolved_account_id }}
          command: d1 migrations apply origin-editorial-v1 --remote --config origin.d1.provision.jsonc
      - name: Confirm server-side editorial schema exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.d1_provision.outputs.resolved_account_id }}
          command: d1 execute origin-editorial-v1 --remote --config origin.d1.provision.jsonc --command "SELECT COUNT(*) AS count FROM origin_revisions;"
      - name: Document separation from ORIGIN public website
        run: |
          echo 'ORIGIN D1 schema initialized without deploying or publishing an editorial API.'
          echo 'Real Cloudflare Access application and verified team memberships are REQUIRED before any authenticated Studio release.'
