name: ORIGIN V9 cinematic home QA
on:
  push:
    branches: [feature/v9-cinematic-home-entry]
    paths: ['www/app/**','www/life/index.html','www/life/styles.css','tests/v9-home-browser.mjs','scripts/verify-v9-home.mjs','.github/workflows/origin-v9-home.yml']
  pull_request:
    branches: [main]
    paths: ['www/app/**','www/life/index.html','www/life/styles.css','tests/v9-home-browser.mjs','scripts/verify-v9-home.mjs','.github/workflows/origin-v9-home.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all preserved ORIGIN experiences
        run: node scripts/verify-v9-home.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the complete V9 app shell in Chromium
        run: node tests/v9-home-browser.mjs
      - name: Publish tested desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORIGIN-V9-Cinematic-Home-QA
          path: artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
