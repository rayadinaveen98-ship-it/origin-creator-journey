name: ORIGIN V8 — Life-First Narrative QA
on:
  push:
    branches: [feature/v8-life-first-narrative]
    paths: ['www/life/**','scripts/verify-v8-life.mjs','tests/v8-life-browser.mjs','.github/workflows/origin-v8-life.yml']
  pull_request:
    branches: [main]
    paths: ['www/life/**','scripts/verify-v8-life.mjs','tests/v8-life-browser.mjs','.github/workflows/origin-v8-life.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  life-first-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify old releases are untouched
        run: node scripts/verify-v8-life.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA for narrative and mobile UI
        run: node tests/v8-life-browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORIGIN-V8-Life-First-QA
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
