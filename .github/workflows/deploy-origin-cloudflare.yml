name: Deploy verified ORIGIN experiences to Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-origin-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origin-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy ORIGIN experiences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production assets
        uses: actions/checkout@v4

      - name: Verify immutable V6 and Story-First 1.6 assets
        shell: bash
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/story-first/index.html
          test -s www/v7/index.html
          test -s www/v7/app.js
          test -s www/v7/styles.css
          test -s www/life/index.html
          test -s www/life/app.js
          test -s www/life/styles.css
          test -s www/app/index.html
          test -s www/app/styles.css
          test -s www/app/app.js
          test -s www/v10/index.html
          test -s www/v10/app.js
          test -s www/v10/styles.css
          test -s www/v10/journey/index.html
          test -s www/v10/journey/story.js
          test -s www/v10/journey/styles.css
          test -s www/v10/journey/life-arc.js
          test -s www/v10/journey/life-arc.css
          test -s www/v10/journey/act2/index.html
          test -s www/v10/journey/act2/act2.js
          test -s www/v10/journey/act2/act2.css
          test -s www/v10/journey/act3/index.html
          test -s www/v10/journey/act3/act3.js
          test -s www/v10/journey/act3/act3.css
          test -s www/v10/journey/act4/index.html
          test -s www/v10/journey/act4/act4.js
          test -s www/v10/journey/act4/act4.css
          test -s www/v10/journey/act5/index.html
          test -s www/v10/journey/act5/act5.js
          test -s www/v10/journey/act5/act5.css
          test -s www/v10/journey/act6/index.html
          test -s www/v10/journey/act6/act6.js
          test -s www/v10/journey/act6/act6.css
          echo '2988addb825d5021c343e2969157ac602fbbf5db795821390c547705e9189cb7  www/index.html' | sha256sum --check
          grep -q 'id="origin15"' www/story-first/index.html
          grep -q 'id="origin16"' www/story-first/index.html
          echo "Both website entry points are present and the original V6 is unchanged."

      - name: Check Cloudflare access configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment is not configured. Add repository Actions secrets CLOUDFLARE_API_TOKEN (Workers Scripts Edit permission) and CLOUDFLARE_ACCOUNT_ID, then rerun this workflow. Do not paste credentials into chat or commit them."
            exit 1
          fi

      - name: Publish complete ./www to existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify live experience responds successfully
        shell: bash
        run: |
          set -euo pipefail
          base='https://origin-creator-journey.rayadinaveen98.workers.dev'
          for path in / /story-first/ /story-first/index.html /v7/ /v7/index.html /v7/app.js /v7/styles.css /life/ /life/index.html /life/app.js /life/styles.css /app/ /app/index.html /app/app.js /app/styles.css /v10/ /v10/index.html /v10/app.js /v10/styles.css /v10/journey/ /v10/journey/index.html /v10/journey/story.js /v10/journey/styles.css /v10/journey/life-arc.js /v10/journey/life-arc.css /v10/journey/act2/ /v10/journey/act2/index.html /v10/journey/act2/act2.js /v10/journey/act2/act2.css /v10/journey/act3/ /v10/journey/act3/index.html /v10/journey/act3/act3.js /v10/journey/act3/act3.css /v10/journey/act4/ /v10/journey/act4/index.html /v10/journey/act4/act4.js /v10/journey/act4/act4.css /v10/journey/act5/ /v10/journey/act5/index.html /v10/journey/act5/act5.js /v10/journey/act5/act5.css /v10/journey/act6/ /v10/journey/act6/index.html /v10/journey/act6/act6.js /v10/journey/act6/act6.css; do
            code="$(curl --retry 4 --retry-delay 3 --retry-all-errors -L -s -o /dev/null -w '%{http_code}' "$base$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Cloudflare returned HTTP $code for $base$path"
              exit 1
            fi
            echo "HTTP $code $base$path"
          done

      - name: Confirm deployed experiences and assets (not SPA fallbacks)
        shell: bash
        run: |
          set -euo pipefail
          base='https://origin-creator-journey.rayadinaveen98.workers.dev'
          curl --fail --silent --show-error --location "$base/v7/index.html" --output "${RUNNER_TEMP}/origin-v7-live.html"
          grep -q '<title>ORIGIN / V7 Alpha' "${RUNNER_TEMP}/origin-v7-live.html"
          curl --fail --silent --show-error --location "$base/v7/app.js" --output "${RUNNER_TEMP}/origin-v7-live.js"
          grep -q 'origin_v7_alpha_01' "${RUNNER_TEMP}/origin-v7-live.js"
          echo 'V7 HTML and actual JavaScript are live (not a fallback from V6).'
          curl --fail --silent --show-error --location "$base/life/index.html" --output "${RUNNER_TEMP}/origin-life-live.html"
          grep -q '<title>ORIGIN / A Life in Frames' "${RUNNER_TEMP}/origin-life-live.html"
          curl --fail --silent --show-error --location "$base/life/app.js" --output "${RUNNER_TEMP}/origin-life-live.js"
          grep -q 'origin_v8_life_scene_v1' "${RUNNER_TEMP}/origin-life-live.js"
          echo 'V8 Life-First HTML and actual JavaScript confirmed live.'
          curl --fail --silent --show-error --location "$base/app/index.html" --output "${RUNNER_TEMP}/origin-app-live.html"
          grep -q '<title>ORIGIN — Enter the Journey' "${RUNNER_TEMP}/origin-app-live.html"
          curl --fail --silent --show-error --location "$base/app/app.js" --output "${RUNNER_TEMP}/origin-app-live.js"
          grep -q 'origin_v9_opening_seen' "${RUNNER_TEMP}/origin-app-live.js"
          echo 'V9 cinematic home HTML and actual JavaScript confirmed live.'
          curl --fail --silent --show-error --location "$base/v10/index.html" --output "${RUNNER_TEMP}/origin-v10-live.html"
          grep -q '<title>ORIGIN — V10 Cinematic Journey' "${RUNNER_TEMP}/origin-v10-live.html"
          curl --fail --silent --show-error --location "$base/v10/app.js" --output "${RUNNER_TEMP}/origin-v10-live.js"
          grep -q 'origin_v10_opening_seen' "${RUNNER_TEMP}/origin-v10-live.js"
          curl --fail --silent --show-error --location "$base/v10/journey/index.html" --output "${RUNNER_TEMP}/origin-v10-story.html"
          grep -q '<title>ORIGIN — The Boy, 1921–1939' "${RUNNER_TEMP}/origin-v10-story.html"
          curl --fail --silent --show-error --location "$base/v10/journey/story.js" --output "${RUNNER_TEMP}/origin-v10-story.js"
          grep -q 'origin_v10_act1_scene_v1' "${RUNNER_TEMP}/origin-v10-story.js"
          echo 'V10 home and Act I story are deployed with actual JavaScript assets.'
          curl --fail --silent --show-error --location "$base/v10/journey/act2/index.html" --output "${RUNNER_TEMP}/origin-v10-act2.html"
          grep -q '<title>ORIGIN — The Artist, 1940–1943' "${RUNNER_TEMP}/origin-v10-act2.html"
          curl --fail --silent --show-error --location "$base/v10/journey/act2/act2.js" --output "${RUNNER_TEMP}/origin-v10-act2.js"
          grep -q 'origin_v10_act2_scene_v1' "${RUNNER_TEMP}/origin-v10-act2.js"
          curl --fail --silent --show-error --location "$base/v10/journey/life-arc.js" --output "${RUNNER_TEMP}/origin-v10-life-arc.js"
          grep -q 'RESEARCHED OVERVIEW' "${RUNNER_TEMP}/origin-v10-life-arc.js"
          echo 'Act II and honest full-life navigation are live.'
          curl --fail --silent --show-error --location "$base/v10/journey/act3/index.html" --output "${RUNNER_TEMP}/origin-v10-act3.html"
          grep -q '<title>ORIGIN — The Dream, 1943–1951' "${RUNNER_TEMP}/origin-v10-act3.html"
          curl --fail --silent --show-error --location "$base/v10/journey/act3/act3.js" --output "${RUNNER_TEMP}/origin-v10-act3.js"
          grep -q 'origin_v10_act3_scene_v1' "${RUNNER_TEMP}/origin-v10-act3.js"
          curl --fail --silent --show-error --location "$base/v10/journey/life-arc.js" --output "${RUNNER_TEMP}/origin-v10-life-arc-final.js"
          grep -q "'/v10/journey/act3/'" "${RUNNER_TEMP}/origin-v10-life-arc-final.js"
          echo 'Act III and its cinematic life-map entry are now live.'
          curl --fail --silent --show-error --location "$base/v10/journey/act4/index.html" --output "${RUNNER_TEMP}/origin-v10-act4.html"
          grep -q '<title>ORIGIN — The First Film, 1952–1955' "${RUNNER_TEMP}/origin-v10-act4.html"
          curl --fail --silent --show-error --location "$base/v10/journey/act4/act4.js" --output "${RUNNER_TEMP}/origin-v10-act4.js"
          grep -q 'origin_v10_act4_scene_v1' "${RUNNER_TEMP}/origin-v10-act4.js"
          curl --fail --silent --show-error --location "$base/v10/journey/life-arc.js" --output "${RUNNER_TEMP}/origin-v10-life-arc-4.js"
          grep -q "'/v10/journey/act4/'" "${RUNNER_TEMP}/origin-v10-life-arc-4.js"
          echo 'Act IV and four-act navigation verified live.'
          curl --fail --silent --show-error --location "$base/v10/journey/act5/index.html" --output "${RUNNER_TEMP}/origin-v10-act5.html"
          grep -q '<title>ORIGIN — Finding His Voice, 1956–1969' "${RUNNER_TEMP}/origin-v10-act5.html"
          curl --fail --silent --show-error --location "$base/v10/journey/act5/act5.js" --output "${RUNNER_TEMP}/origin-v10-act5.js"
          grep -q 'origin_v10_act5_scene_v1' "${RUNNER_TEMP}/origin-v10-act5.js"
          curl --fail --silent --show-error --location "$base/v10/journey/life-arc.js" --output "${RUNNER_TEMP}/origin-v10-life-arc-5.js"
          grep -q "'/v10/journey/act5/'" "${RUNNER_TEMP}/origin-v10-life-arc-5.js"
          echo 'Act V and five-act navigation verified live.'
          curl --fail --silent --show-error --location "$base/v10/journey/act6/index.html" --output "${RUNNER_TEMP}/origin-v10-act6.html"
          grep -q '<title>ORIGIN — The Wider World, 1970–1983' "${RUNNER_TEMP}/origin-v10-act6.html"
          curl --fail --silent --show-error --location "$base/v10/journey/act6/act6.js" --output "${RUNNER_TEMP}/origin-v10-act6.js"
          grep -q 'origin_v10_act6_scene_v1' "${RUNNER_TEMP}/origin-v10-act6.js"
          curl --fail --silent --show-error --location "$base/v10/journey/life-arc.js" --output "${RUNNER_TEMP}/origin-v10-life-arc-6.js"
          grep -q "'/v10/journey/act6/'" "${RUNNER_TEMP}/origin-v10-life-arc-6.js"
          echo 'Act VI and six-act life map verified live.'

      - name: Record verified live deployment in GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# ORIGIN — Verified Cloudflare Worker deployment'
            echo
            echo "Verified UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "GitHub source commit: \`$GITHUB_SHA\`"
            echo
            echo "GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Cloudflare Worker: https://origin-creator-journey.rayadinaveen98.workers.dev/"
            echo
            echo 'Verified entry points: / (frozen V6), /story-first/ (Story-First 1.6), /v7/ (isolated V7 Alpha 01), /life/ (V8 Life-First), /app/ (V9 cinematic home), /v10/ (V10 home) and /v10/journey/ (V10 Living Act I), /v10/journey/act2/ (V10 Living Act II, 1940–1943), /v10/journey/act3/ (V10 Living Act III, 1943–1951), /v10/journey/act4/ (V10 Living Act IV, 1952–1955), /v10/journey/act5/ (V10 Living Act V, 1956–1969), /v10/journey/act6/ (V10 Living Act VI, 1970–1983).'
            echo
            echo 'Note: HTTP and asset checks prove deployment, not full real-device acceptance testing.'
          } > docs/ORIGIN_LIVE_VERIFIED.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ORIGIN_LIVE_VERIFIED.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified ORIGIN Cloudflare deployment [skip ci]'
            git push origin HEAD:main
          fi
